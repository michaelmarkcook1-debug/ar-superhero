name: Build and typecheck

# Replaces the stock "NodeJS with Webpack" starter workflow, which ran
# `npx webpack` against a repo that has no webpack, no webpack config and no
# src/index.js entry — it failed on every push. This project builds with Vite
# (client) and esbuild (server) via `npm run build`.
#
# The typecheck is the point of this workflow, not a formality: neither build
# resolves undefined identifiers, so a missing import type-checks as a runtime
# ReferenceError and ships. That is exactly how a blank production page got
# deployed once. `tsc --noEmit` catches it; the bundlers do not.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
